<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lavabo Lacetania</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; border-radius: 20px; padding: 1.8rem; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    h2 { font-size: 1.4rem; color: #1a1a1a; margin-top: 0; margin-bottom: 0.5rem; }
    .user-badge { background: #eef2f7; border-radius: 12px; padding: 8px 12px; font-size: 0.85rem; color: #4a5568; margin-bottom: 1.5rem; display: inline-block; font-weight: 500; }
    
    .status-box { border-radius: 16px; padding: 1.5rem; margin: 1rem 0; font-weight: 600; font-size: 1.1rem; line-height: 1.4; transition: all 0.3s ease; }
    .status-idle { background: #f8fafc; color: #64748b; border: 2px dashed #cbd5e1; }
    .status-queue { background: #fff7ed; color: #c2410c; border: 2px solid #ffedd5; }
    .status-active { background: #f0fdf4; color: #15803d; border: 2px solid #bbf7d0; animation: pulse 2s infinite; }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    button { width: 100%; border: none; padding: 16px; font-size: 1rem; border-radius: 14px; font-weight: 700; cursor: pointer; transition: transform 0.1s, background-color 0.2s; margin-top: 10px; }
    button:active { transform: scale(0.98); }
    .btn-main { background: #2563eb; color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .btn-return { background: #16a34a; color: white; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3); }
    .btn-logout { background: transparent; color: #94a3b8; font-size: 0.85rem; padding: 8px; margin-top: 1rem; font-weight: 500; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚪 Gestió del Lavabo</h2>
    <div id="user-info" class="user-badge">Carregant...</div>

    <div id="app" style="display:none;">
      <div id="status-container" class="status-box status-idle">
        Carregant estat...
      </div>

      <div id="action-area"></div>

      <button class="btn-logout" onclick="logout()">Tancar Sessió</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCd1b_L2Q7ZYHa3mtfCcBr7wjL_iVZnX-s",
      authDomain: "lavabo-lacetania.firebaseapp.com",
      projectId: "lavabo-lacetania",
      storageBucket: "lavabo-lacetania.firebasestorage.app",
      messagingSenderId: "690578428151",
      appId: "1:690578428151:web:7eb07f1603f73f6be1c3f2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ hd: "lacetania.cat" });

    let currentUser = null;
    let currentDocId = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (!user.email.endsWith("@lacetania.cat")) {
          alert("Accés restringit al domini @lacetania.cat");
          auth.signOut();
          return;
        }

        if (user.email === "cap.adjunt@lacetania.cat") {
          window.location.href = "professors.html";
          return;
        }

        currentUser = user;
        document.getElementById("user-info").innerText = user.displayName;
        document.getElementById("app").style.display = "block";
        escoltarEstatAlumne();
      } else {
        currentUser = null;
        document.getElementById("user-info").innerText = "Sessió no iniciada";
        document.getElementById("app").style.display = "block";
        document.getElementById("status-container").className = "status-box status-idle";
        document.getElementById("status-container").innerText = "Inicia sessió per continuar";
        document.getElementById("action-area").innerHTML = `<button class="btn-main" onclick="login()">Inicia sessió amb Google</button>`;
      }
    });

    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    window.sollicitarLavabo = async () => {
      if (!currentUser) return;
      try {
        await addDoc(collection(db, "sollicituds"), {
          uid: currentUser.uid,
          nom: currentUser.displayName,
          email: currentUser.email,
          estat: "en_cua",
          timestamp_sollicitud: serverTimestamp(),
          timestamp_autoritzacio: null,
          timestamp_retorn: null
        });
      } catch (e) {
        alert("Error en sol·licitar el lavabo.");
      }
    };

    window.marcarRetornat = async () => {
      if (!currentDocId) return;
      try {
        await updateDoc(doc(db, "sollicituds", currentDocId), {
          estat: "finalitzat",
          timestamp_retorn: serverTimestamp()
        });
      } catch (e) {
        alert("Error en registrar el retorn.");
      }
    };

    function escoltarEstatAlumne() {
      const q = query(
        collection(db, "sollicituds"),
        where("uid", "==", currentUser.uid),
        where("estat", "in", ["en_cua", "autoritzat"])
      );

      onSnapshot(q, (snapshot) => {
        const box = document.getElementById("status-container");
        const actionArea = document.getElementById("action-area");

        if (!snapshot.empty) {
          const docSnap = snapshot.docs[0];
          currentDocId = docSnap.id;
          const d = docSnap.data();

          if (d.estat === "autoritzat") {
            box.className = "status-box status-active";
            box.innerHTML = "🟢 <strong>TENS PERMÍS!</strong><br><small>Ves al lavabo i marca la tornada quan tornis a la classe.</small>";
            actionArea.innerHTML = `<button class="btn-return" onclick="marcarRetornat()">✅ Ja he tornat a classe</button>`;
          } else {
            box.className = "status-box status-queue";
            box.innerHTML = "⏳ <strong>A LA CUA D'ESPERA</strong><br><small>Espera que el professor t'autoritzi la sortida.</small>";
            actionArea.innerHTML = `<button disabled style="opacity:0.6; cursor:not-allowed;">Sol·licitud enviada...</button>`;
          }
        } else {
          currentDocId = null;
          box.className = "status-box status-idle";
          box.innerText = "Prem el botó per demanar anar al lavabo.";
          actionArea.innerHTML = `<button class="btn-main" onclick="sollicitarLavabo()">🧻 Sol·licitar Lavabo</button>`;
        }
      });
    }
  </script>
</body>
</html>
